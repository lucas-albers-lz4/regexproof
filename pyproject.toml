[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regexproof"
version = "0.1.0"
description = "Prove security properties of regexes with Z3 — compiler, harness, batch, and ReDoS tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "z3-solver==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
]

[tool.setuptools.packages.find]
include = ["regexproof*"]

[tool.setuptools.package-data]
regexproof = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Curated set, same spine as the housekeeping toolkit (E,F,W,I,UP,SIM,PTH,PIE,PLC)
# plus RUF (ruff-specific) and EXE (shebang/executable-bit — CLI tools must run).
# Deliberately NOT selected (by-design noise for small solver scripts):
#   ANN*   — no annotation mandates on throwaway solver scripts
#   D*     — docstring pedantry; the scripts carry module + key-function docstrings
#   FBT*   — boolean flags (expect_unsat=...) are the intended API
#   PLR*   — magic-number / complexity refactors; solver constants are the domain
#   Q*     — quote-style churn; mixed ' and " is deliberate (strings contain quotes)
#   T201   — print IS the CLI output of these tools
#   COM*   — trailing-comma style churn
select = ["E", "F", "W", "I", "UP", "SIM", "PTH", "PIE", "PLC", "RUF", "EXE"]

[tool.ruff.lint.per-file-ignores]
# z3py idiom: the official Z3 guide's own examples use `from z3 import *`.
# The template is a copy-and-adapt artifact; keeping the star import matches
# the upstream documentation the template points at. The harness
# (z3-verify.py) uses explicit imports and is fully lint-clean.
"scripts/z3-property-template.py" = [
    "F403",  # star import used — deliberate (z3py idiom)
    "F405",  # star-import names — resolved by the z3 library, not undefined
]

# Long lines are load-bearing in the solver scripts: Z3 regex expressions
# and example invocations in docstrings routinely exceed 100 columns, and
# wrapping them hurts copy-paste fidelity more than it helps readability.
"scripts/differential-fuzz.py" = [
    "E501",
]
