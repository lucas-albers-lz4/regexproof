[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regexproof"
version = "0.1.0"
description = "Prove security properties of regexes with Z3 — compiler, harness, batch, and ReDoS tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "z3-solver==5.0.0",
    "requests==2.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
]

[project.scripts]
regexproof = "regexproof.cli:main"

[tool.setuptools.packages.find]
include = ["regexproof*"]

[tool.setuptools.package-data]
regexproof = ["schemas/*.json", "admission/*.json", "mine/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
# Data, not source: vendored/curated corpus pulls and intentional minimal test
# fixtures are never lint targets (they'd spam F821/invalid-syntax/sample noise
# and block the mining funnel). regexproof's own code under batch/, helpers/,
# regexproof/, scripts/, sweep/, tests/ (non-fixture) is still fully linted.
extend-exclude = [
    "batch/corpora",
    "tests/fixtures",
]

[tool.ruff.lint]
# Conservative, funnel-friendly set. Catch real defects cheaply without
# blocking mining jobs on style noise. These run over the whole tree in a
# fast (<1 min) CI lint job.
# RULE OF THUMB: use safe `ruff --fix` ONLY. NEVER `--unsafe-fixes` — it has
# broken things before and is banned for this repo.
#   E   pycodestyle errors (E501 line-length excluded — long lines are
#       load-bearing in solver/generated/corpus code)
#   F   pyflakes — undefined names, unused imports/vars (the real-bug catcher)
#   W   warnings
#   RUF ruff-specific (RUF002/003 unicode ×/∨ excluded — deliberate math
#       notation in the Z3 docs)
# Deliberately NOT selected (by-design noise / low value for this funnel):
#   PLC  — incl. PLC0415 function-level lazy imports, a deliberate pattern
#          here (lazy deps, avoid import cycles)
#   SIM / PTH / PIE — style simplifications (Yoda, pathlib pedantry, range start)
#   I    — import sorting (cosmetic churn, no correctness value)
#   UP   — pyupgrade modernization (unneeded for the py39 target)
#   EXE  — EXE001 non-executable shebang (helpers are run via `python`, not exec)
#   ANN*, D*, FBT*, PLR*, Q*, T201, COM* — as before (by-design noise)
select = ["E", "F", "W", "RUF"]
ignore = ["E501", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# z3py idiom: the official Z3 guide's own examples use `from z3 import *`.
# The template is a copy-and-adapt artifact; keeping the star import matches
# the upstream documentation the template points at. The harness
# (z3-verify.py) uses explicit imports and is fully lint-clean.
"scripts/z3-property-template.py" = [
    "F403",  # star import used — deliberate (z3py idiom)
    "F405",  # star-import names — resolved by the z3 library, not undefined
]

# Long lines are load-bearing in the solver scripts: Z3 regex expressions
# and example invocations in docstrings routinely exceed 100 columns, and
# wrapping them hurts copy-paste fidelity more than it helps readability.
"scripts/differential-fuzz.py" = [
    "E501",
]
