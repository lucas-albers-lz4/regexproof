name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  matrix:
    name: Read Python matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      minors: ${{ steps.set.outputs.minors }}
    steps:
      - uses: actions/checkout@v5
      - name: Load ci/python-matrix.toml (non-empty required)
        id: set
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          minors = tomllib.loads(Path("ci/python-matrix.toml").read_text()).get("minors") or []
          assert len(minors) >= 1, "ci/python-matrix.toml minors must be non-empty"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"minors={json.dumps(minors)}\n")
          print("minors", minors)
          PY

  proof:
    name: Z3 proof harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build go-re2 helper (property-subset rule_diff)
        working-directory: helpers/go-re2
        run: go build -o go-re2 .
      - name: Install package + pinned solver
        run: pip install -e ".[dev]"
      - name: Assert toolchain pins (proof)
        run: python scripts/ci-assert-toolchain.py --job proof
      - name: Assert ReDoS deps not in proof env
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("regexploit") is None, "regexploit must not be in proof job"
          import subprocess, sys
          freeze = subprocess.check_output([sys.executable, "-m", "pip", "freeze"], text=True)
          for banned in ("regexploit", "vuln-regex-detector", "vuln_regex_detector"):
              assert banned not in freeze.lower(), f"banned dep in proof freeze: {banned}"
          print("proof isolation ok")
          PY
      - name: Named mutation-coverage gate
        run: python scripts/z3-verify.py --check-mutation-coverage
      - name: Run the 4 canonical property shapes
        run: python scripts/z3-property-template.py --fail-on-property-failure
      - name: Run the property suite with mutation guards
        # TIMEOUT (unknown) is a hard failure by design — the harness exits 1.
        # --require-ground-truth: SAT witnesses must replay against the real
        # implementation (sed/escaper mirrors) or ok=False.
        # --require-domain (P1, #425): every property/counterexample_finder
        # must declare input_domain or the gate hard-fails (VF-006 / TRAPS #17).
        # --fail-on-property-failure (#360): ok=False is exit 1 so a violated
        # property cannot ship green. Default CLI stays the §10 recorder.
        run: python scripts/z3-verify.py --all --require-ground-truth --require-domain --fail-on-property-failure
      - name: Named property subset (P1-P4 + one rule_diff family)
        run: |
          python scripts/ci-run-property-subset.py
      - name: Differential-fuzz mirror vs real grep (argv-only)
        run: |
          python scripts/differential-fuzz.py \
            --mirror-expr "Concat(Union(Range('a','z'),Range('0','9'),Re('.'),Re('_'),Re('-')),Star(Union(Range('a','z'),Range('0','9'),Re('.'),Re('_'),Re('-'))))" \
            --alphabet "abc123._-" --mutations ' ;="`$|&' --runs 100 --seed 42 \
            --real-argv grep -qE '^[a-z0-9._-]+$'
      - name: Static reject shell=True in fuzz paths
        run: python -c "from regexproof.fuzz.adapters import reject_shell_subprocess_usage; v=reject_shell_subprocess_usage(); assert not v, v"
      - name: Static reject untimed subprocess in compiler/helpers
        run: python -c "from regexproof.fuzz.adapters import reject_untimed_subprocess_usage; v=reject_untimed_subprocess_usage(); assert not v, v"
      - name: CI contract tests (NDJSON / json-legacy)
        run: pytest -q tests/test_ci_contracts.py

  golden:
    name: Golden suite (Python ${{ matrix.python-version }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Sourced from ci/python-matrix.toml via the matrix job — do not hardcode.
        python-version: ${{ fromJson(needs.matrix.outputs.minors) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JS helper deps
        run: npm install --prefix helpers/ecma
      - name: Build go-re2 helper
        working-directory: helpers/go-re2
        run: go build -o go-re2 .
      - name: Install YARA + PCRE2 + busybox (Wave 2 + E2 mirror-fidelity)
        run: |
          sudo apt-get update
          sudo apt-get install -y yara pcre2-utils busybox
          yara -v
          pcre2grep --version | head -1
          busybox sed --help | head -1
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Assert toolchain pins (golden)
        run: python scripts/ci-assert-toolchain.py --job golden
      - name: Named coverage-matrix floors
        run: pytest -q tests/test_golden.py::test_coverage_matrix_floors
      - name: Mutation-coverage gate (umbrella gate 10, #220)
        run: python scripts/z3-verify.py --check-mutation-coverage
      - name: Named extractor-accuracy fixtures
        run: pytest -q tests/test_extractors.py
      - name: Pytest (golden + foundations; ReDoS smoke in redos job)
        run: pytest -q --ignore=tests/test_redos_smoke.py
      - name: Phase 2 pilots (extract → fraction → properties)
        run: |
          python scripts/pilot-run.py
          python scripts/pilot-properties.py --require-ground-truth --require-domain
      - name: Phase 3 shape-5 rule_diff (gitleaks encodable subset)
        # --require-domain is accepted for CLI parity with the proof job; the
        # check is INERT here — check_domain_coverage covers kind=property and
        # counterexample_finder only, and this pilot's registry is rule_diff
        # gaps + mutation guards (see scripts/rule-diff-pilot.py).
        run: python scripts/rule-diff-pilot.py --require-ground-truth --require-domain
      - name: Materialize detect-secrets corpus pin (v1.5.0)
        run: |
          git clone --depth 1 --branch v1.5.0 \
            https://github.com/Yelp/detect-secrets.git /tmp/detect-secrets
          test "$(git -C /tmp/detect-secrets rev-parse HEAD)" = "01886c8a910c64595c47f186ca1ffc0b77fa5458"
          ln -sfn /tmp/detect-secrets/detect_secrets/plugins \
            batch/corpora/detect-secrets/plugins
      - name: Materialize CRS version-diff trees (shape-5 batch, #477)
        # Older+newer rule trees unlock contracted CRS version_diff execution
        # in --corpus all (writes coreruleset_batch_shape5.json → conversion).
        # Pin tag SHAs like detect-secrets so retagged releases cannot drift
        # Z3 outcomes without a regexproof change.
        run: |
          mkdir -p /tmp/crs-shape5
          git clone --depth 1 --branch v4.27.0 \
            https://github.com/coreruleset/coreruleset.git \
            /tmp/crs-shape5/coreruleset-v4.27.0
          test "$(git -C /tmp/crs-shape5/coreruleset-v4.27.0 rev-parse HEAD)" = \
            "bb64941f9beb3382fecd215c9ef032c427884ff0"
          git clone --depth 1 --branch v4.28.0 \
            https://github.com/coreruleset/coreruleset.git \
            /tmp/crs-shape5/coreruleset-v4.28.0
          test "$(git -C /tmp/crs-shape5/coreruleset-v4.28.0 rev-parse HEAD)" = \
            "55b09f5acfd16413e7b31041100711ceb7adc89c"
          test -d /tmp/crs-shape5/coreruleset-v4.27.0/rules
          test -d /tmp/crs-shape5/coreruleset-v4.28.0/rules
      - name: Phase 5 batch mode
        run: |
          # --require-ground-truth (P1, #425): SAT-ish Z3-verdict findings must
          # carry ground_truth_status=reproduced or the evidence gate fails.
          # --synthesize (P3, #427): the committed synthesized rows + guards
          # are regenerated here; the evidence gate enforces the guard SAT
          # contract, so a regression flips CI red.
          python -m regexproof.batch --corpus all --require-ground-truth --synthesize
           pytest -q tests/test_batch.py tests/test_evidence_gates.py tests/test_synth_fixtures.py
      - name: Two-run batch reproducibility
        run: python scripts/ci-batch-repro.py --synthesize
      - name: D5 compiler-feature-yield artifact (regenerated, #429)
        # The artifact decides the next compiler wave — it is observational
        # only and must regenerate deterministically in the golden job.
        run: python scripts/triage-feature-yield.py
      - name: D5 artifact drift check (#429, luna gate 1)
        # Stale committed artifacts must fail CI, not pass silently.
        run: |
          git diff --exit-code -- \
            properties/generated/compiler-feature-yield.json \
            properties/generated/compiler-feature-yield.md
      - name: Conversion ledger (regenerated)
        # Product funnel: sites → properties asked → SAT → GT → upstream.
        # Orthogonal to D5 (compiler coverage). Observational; must regenerate
        # after batch so scanner NDJSON identity matches the committed ledger.
        run: python scripts/conversion-ledger.py
      - name: Conversion ledger drift check
        run: |
          git diff --exit-code -- \
            properties/generated/conversion-ledger.json \
            properties/generated/conversion-ledger.md
      - name: E2 busybox-sed dual-engine replay enforced (#429, luna gate 1)
        # Both engine verdicts must be recorded and agree; a busybox absence
        # or a GNU/busybox divergence is a hard failure.
        run: python scripts/ci-check-busybox-sed.py
      - name: P8 gate-labels artifact (regenerated, #432)
        # The D3 fit source regenerates OFFLINE (no network) from the
        # tracked inputs (decisions + ledger + mine-tree-features.json).
        run: python scripts/build-gate-labels.py
      - name: P8 gate-labels drift check (#432, luna gate 1)
        # Stale or hand-edited labels must fail CI, not pass silently.
        run: git diff --exit-code -- properties/generated/gate-labels.json
      - name: P8 score-v2 weights (refit, #432)
        # The deterministic fit must reproduce the committed weights
        # exactly; a stale or hand-edited model fails CI.
        run: python scripts/fit-score-v2.py
      - name: P8 score-v2 weights drift check (#432, luna gate 1)
        run: git diff --exit-code -- regexproof/mine/score_v2_weights.json

  compiler-diff-fuzz:
    # E1 (#429): PRs touching regexproof/compiler/** run the EXPANDED
    # mirror-fidelity + differential-fuzz surfaces (higher --runs). The
    # concrete filter is declared in the paths step below; a docs-only PR
    # does not run the expanded job. Push-triggered runs already exercise
    # the stock surfaces in the proof job.
    name: Compiler diff-fuzz (expanded, E1 #429)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        name: Detect regexproof/compiler/** changes
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD \
            | grep -q '^regexproof/compiler/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JS helper deps
        if: steps.paths.outputs.changed == 'true'
        run: npm install --prefix helpers/ecma
      - name: Build go-re2 helper
        if: steps.paths.outputs.changed == 'true'
        working-directory: helpers/go-re2
        run: go build -o go-re2 .
      - name: Install YARA + PCRE2 + busybox
        if: steps.paths.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y yara pcre2-utils busybox
      - name: Install package
        if: steps.paths.outputs.changed == 'true'
        run: pip install -e ".[dev]"
      - name: Mirror-fidelity gate (expanded runs)
        if: steps.paths.outputs.changed == 'true'
        run: python scripts/mirror-fidelity-gate.py --runs 400 --seed 42
      - name: Differential-fuzz (expanded runs)
        if: steps.paths.outputs.changed == 'true'
        run: |
          python scripts/differential-fuzz.py \
            --mirror-expr "Concat(Union(Range('a','z'),Range('0','9'),Re('.'),Re('_'),Re('-')),Star(Union(Range('a','z'),Range('0','9'),Re('.'),Re('_'),Re('-'))))" \
            --alphabet "abc123._-" --mutations ' ;="`$|&' --runs 300 --seed 42 \
            --real-argv grep -qE '^[a-z0-9._-]+$'
          python scripts/differential-fuzz.py \
            --mirror-expr "Concat(Range('a','z'),Star(Union(Range('a','z'),Range('0','9'))))" \
            --alphabet "abc012" --mutations ';|&`' --runs 300 --seed 42 \
            --real-argv pcre2grep -q '^[a-z][a-z0-9]*$'

  noodler:
    # Quoted: unquoted YAML treats `#220)` as a comment and truncates the
    # GitHub check name, so branch protection never matches the required
    # context `Noodler backend (pinned asset + pre-flight, #220)` (#364).
    name: "Noodler backend (pinned asset + pre-flight, #220)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install the cvc5 wheel (P6 scope — the cross-check leg runs)
        run: pip install cvc5
      - name: Download pinned Noodler asset (sha256-verified, R5 policy)
        run: |
          curl -fsSL -o /tmp/z3-noodler \
            https://github.com/VeriFIT/z3-noodler/releases/download/v1.6.1/z3-noodler-ubuntu-24.04-x86_64-shared
          echo "22b19f123d3e7f54e10fdc46af3f91de23d89148c9a259eb072bc9e12f083464  /tmp/z3-noodler" \
            | sha256sum -c -
          chmod +x /tmp/z3-noodler
      - name: R8 runtime pre-flight (fixtures + determinism)
        run: python sweep/harness-backends/preflight.py /tmp/z3-noodler
      - name: S16 noodler-backed property via the real binary
        run: |
          NOODLER=/tmp/z3-noodler python scripts/z3-verify.py --json P1-space \
            | python -c "
          import json, sys
          r = json.loads(sys.stdin.read().splitlines()[-1])
          assert r.get('noodler_verdict') not in (None, 'ABSENT'), r
          assert r.get('state') == 'decided', r
          assert r.get('ok') is True, r            # the property HOLDS
          assert r.get('result') == 'unsat', r
          assert r.get('cross_check_absent') is not True, r  # cvc5 leg installed
          print('noodler leg ran:', r.get('noodler_verdict'), 'ok=', r.get('ok'),
                'cc=', r.get('cross_check_verdict') or r.get('cross_check_reason'))
          "
      - name: Stock-only suite stays green (noodler property treated as absent)
        run: |
          python scripts/z3-verify.py --json P1-space \
            | python -c "
          import json, sys
          r = json.loads(sys.stdin.read().splitlines()[-1])
          assert r.get('noodler_verdict') == 'ABSENT', r
          assert r.get('triage_fallback') is True, r
          assert r.get('ok') is True, r
          print('absent fallback green: ok=', r.get('ok'))
          "

  redos:
    name: ReDoS stage (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JS ReDoS helpers (pinned)
        run: npm ci --prefix helpers/redos
      - name: Create isolated redos-env
        run: |
          python -m venv redos-env
          redos-env/bin/pip install -U pip
          redos-env/bin/pip install -e ".[dev]"
          redos-env/bin/pip install -r requirements-redos.txt
      - name: Assert toolchain pins (redos)
        run: redos-env/bin/python scripts/ci-assert-toolchain.py --job redos
      - name: ReDoS schema / join / smoke
        env:
          REGEXPROOF_RECHECK_TIMEOUT_MS: "20000"
        run: |
          redos-env/bin/pytest -q \
            tests/test_redos_schema.py \
            tests/test_redos_join.py \
            tests/test_redos_smoke.py
      - name: Runner smoke on fixture JSONL
        run: |
          redos-env/bin/python - <<'PY'
          import json
          from pathlib import Path
          from regexproof.regex_id import make_regex_id
          from regexproof.redos.runner import run_file

          corpus = json.loads(Path("tests/fixtures/redos/corpus.json").read_text())
          lines = []
          for fix in corpus["fixtures"]:
              ext = dict(fix["extractor"])
              ext["regex_id"] = make_regex_id(
                  repo=ext["repo"],
                  pattern=ext["pattern"],
                  flags=ext.get("flags") or "",
                  dialect=ext["dialect"],
                  call_kind=ext["call_kind"],
                  site=ext["site"],
              )
              lines.append(json.dumps(ext))
          inp = Path("/tmp/redos-extractor.jsonl")
          out = Path("/tmp/redos-findings.jsonl")
          inp.write_text("\n".join(lines) + "\n")
          raise SystemExit(run_file(inp, out, triage=True))
          PY
          test -s /tmp/redos-findings.jsonl
      - name: Static reject shell=True in ReDoS paths
        run: |
          redos-env/bin/python -c "from regexproof.fuzz.adapters import reject_shell_subprocess_usage; from pathlib import Path; v=reject_shell_subprocess_usage([Path('regexproof/redos'), Path('helpers/redos')]); assert not v, v"

  links:
    # Required gate (branch protection name must stay exactly `Link check`).
    # Policy: lychee.toml + #377. Corpus READMEs are path-filtered below —
    # they dominate GitHub issue URL fan-out and cause HTTP/2 flakes.
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .lycheecache
          # Include all markdown: required job still scans helpers/** and
          # properties/*.md (only batch/corpora + properties/generated are
          # exclude-path'd). Narrow keys left stale failures after URL recovery.
          key: lychee-${{ runner.os }}-${{ hashFiles('lychee.toml', '**/*.md') }}
          restore-keys: |
            lychee-${{ runner.os }}-
      - name: Check markdown links (required surface)
        uses: lycheeverse/lychee-action@v2
        with:
          # Real gate: fail on broken links (NO --no-fail).
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          args: >-
            --config lychee.toml
            --exclude-path '(^|/)batch/corpora(/|$)'
            --exclude-path '(^|/)properties/generated(/|$)'
            "**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links-corpora:
    # Not branch-protected. Runs only when corpus READMEs change so Smith
    # admit PRs still validate their issue links without every PR re-herding
    # 100+ GitHub issue URLs (#377).
    name: Link check (corpora)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            corpora_md:
              - 'batch/corpora/**/*.md'
      - uses: actions/cache@v4
        if: steps.filter.outputs.corpora_md == 'true'
        with:
          path: .lycheecache
          key: lychee-corpora-${{ runner.os }}-${{ hashFiles('lychee.toml') }}-${{ hashFiles('batch/corpora/**/*.md') }}
          restore-keys: |
            lychee-corpora-${{ runner.os }}-
            lychee-${{ runner.os }}-
      - name: Check corpus README links
        if: steps.filter.outputs.corpora_md == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          args: >-
            --config lychee.toml
            "batch/corpora/**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip (no corpus markdown changes)
        if: steps.filter.outputs.corpora_md != 'true'
        run: echo "No batch/corpora/**/*.md changes — skipping corpora link check."
