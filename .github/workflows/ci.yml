name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Read Python matrix
    runs-on: ubuntu-latest
    outputs:
      minors: ${{ steps.set.outputs.minors }}
    steps:
      - uses: actions/checkout@v5
      - name: Load ci/python-matrix.toml (non-empty required)
        id: set
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          minors = tomllib.loads(Path("ci/python-matrix.toml").read_text()).get("minors") or []
          assert len(minors) >= 1, "ci/python-matrix.toml minors must be non-empty"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"minors={json.dumps(minors)}\n")
          print("minors", minors)
          PY

  proof:
    name: Z3 proof harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install package + pinned solver
        run: pip install -e ".[dev]"
      - name: Assert ReDoS deps not in proof env
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("regexploit") is None, "regexploit must not be in proof job"
          import subprocess, sys
          freeze = subprocess.check_output([sys.executable, "-m", "pip", "freeze"], text=True)
          for banned in ("regexploit", "vuln-regex-detector", "vuln_regex_detector"):
              assert banned not in freeze.lower(), f"banned dep in proof freeze: {banned}"
          print("proof isolation ok")
          PY
      - name: Run the 4 canonical property shapes
        run: python scripts/z3-property-template.py
      - name: Run the property suite with mutation guards
        # TIMEOUT (unknown) is a hard failure by design — the harness exits 1.
        # --require-ground-truth: SAT witnesses must replay against the real
        # implementation (sed/escaper mirrors) or the run fails.
        run: python scripts/z3-verify.py --all --require-ground-truth
      - name: Differential-fuzz mirror vs real grep (argv-only)
        run: |
          python scripts/differential-fuzz.py \
            --mirror-expr "Concat(Union(Range('a','z'),Range('0','9'),Re('.'),Re('_'),Re('-')),Star(Union(Range('a','z'),Range('0','9'),Re('.'),Re('_'),Re('-'))))" \
            --alphabet "abc123._-" --mutations ' ;="`$|&' --runs 100 --seed 42 \
            --real-argv grep -qE '^[a-z0-9._-]+$'
      - name: Static reject shell=True in fuzz paths
        run: python -c "from regexproof.fuzz.adapters import reject_shell_subprocess_usage; v=reject_shell_subprocess_usage(); assert not v, v"

  golden:
    name: Golden suite (Python ${{ matrix.python-version }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sourced from ci/python-matrix.toml via the matrix job — do not hardcode.
        python-version: ${{ fromJson(needs.matrix.outputs.minors) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JS helper deps
        run: npm install --prefix helpers/ecma
      - name: Build go-re2 helper
        working-directory: helpers/go-re2
        run: go build -o go-re2 .
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Pytest (golden + foundations; ReDoS smoke in redos job)
        run: pytest -q --ignore=tests/test_redos_smoke.py
      - name: Phase 2 pilots (extract → fraction → properties)
        run: |
          python scripts/pilot-run.py
          python scripts/pilot-properties.py --require-ground-truth
      - name: Phase 3 shape-5 rule_diff (gitleaks encodable subset)
        run: python scripts/rule-diff-pilot.py --require-ground-truth
      - name: Phase 5 batch mode
        run: |
          python -m regexproof.batch --corpus all
          pytest -q tests/test_batch.py

  redos:
    name: ReDoS stage (isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JS ReDoS helpers (pinned)
        run: npm ci --prefix helpers/redos || npm install --prefix helpers/redos
      - name: Create isolated redos-env
        run: |
          python -m venv redos-env
          redos-env/bin/pip install -U pip
          redos-env/bin/pip install -e ".[dev]"
          redos-env/bin/pip install -r requirements-redos.txt
      - name: ReDoS schema / join / smoke
        env:
          REGEXPROOF_RECHECK_TIMEOUT_MS: "20000"
        run: |
          redos-env/bin/pytest -q \
            tests/test_redos_schema.py \
            tests/test_redos_join.py \
            tests/test_redos_smoke.py
      - name: Runner smoke on fixture JSONL
        run: |
          redos-env/bin/python - <<'PY'
          import json
          from pathlib import Path
          from regexproof.regex_id import make_regex_id
          from regexproof.redos.runner import run_file

          corpus = json.loads(Path("tests/fixtures/redos/corpus.json").read_text())
          lines = []
          for fix in corpus["fixtures"]:
              ext = dict(fix["extractor"])
              ext["regex_id"] = make_regex_id(
                  repo=ext["repo"],
                  pattern=ext["pattern"],
                  flags=ext.get("flags") or "",
                  dialect=ext["dialect"],
                  call_kind=ext["call_kind"],
                  site=ext["site"],
              )
              lines.append(json.dumps(ext))
          inp = Path("/tmp/redos-extractor.jsonl")
          out = Path("/tmp/redos-findings.jsonl")
          inp.write_text("\n".join(lines) + "\n")
          raise SystemExit(run_file(inp, out, triage=True))
          PY
          test -s /tmp/redos-findings.jsonl
      - name: Static reject shell=True in ReDoS paths
        run: |
          redos-env/bin/python -c "from regexproof.fuzz.adapters import reject_shell_subprocess_usage; from pathlib import Path; v=reject_shell_subprocess_usage([Path('regexproof/redos'), Path('helpers/redos')]); assert not v, v"

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Real gate: fail on broken links (NO --no-fail). The two excluded
          # hosts return 403 to scripted clients (bot protection) but resolve
          # in a browser — documented in docs/RESEARCH.md.
          args: --verbose --exclude 'https://dl.acm.org/.*' --exclude 'https://www.microsoft.com/en-us/research/.*' "**/*.md"
