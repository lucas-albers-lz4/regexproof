rules:
  - id: sample.pattern-regex
    patterns:
      - pattern-regex: (?i)select\b.*from
  - id: sample.quoted
    pattern: "legacy"
  - id: sample.block
    patterns:
      - pattern-regex: |
          multi
          line
  - id: sample.metavar
    metavariable-regex:
      $KEY: "[A-Za-z0-9_]{8,}"
  - id: sample.code-pattern
    patterns:
      - pattern: $CLIENT.chat.completions.create(...)
