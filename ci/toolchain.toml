# Pinned toolchains for Phase 6 CI drift assertions.
# Each job runs scripts/ci-assert-toolchain.py --job <name> and fails on mismatch.

[python]
# Must match ci/python-matrix.toml minors (golden) and proof/redos job versions.
minors = ["3.12", "3.13"]
proof = "3.13"
redos = "3.13"

[z3]
# pip pin: requirements.txt / pyproject.toml
version_prefix = "5.0"

[node]
# setup-node major used in golden + redos jobs
major = 22

[go]
# setup-go version used in golden (go-re2 helper)
version = "1.22"

[pcre2]
# Golden job installs pcre2-utils (Wave 2 mirror-fidelity surfaces).
status = "required"
helper = "pcre2grep"

[yara]
# Golden job installs yara (Wave 2 encoding-domain gate).
status = "required"
version_prefix = "4."

[perl]
# Wave 3 ground-truth helper (SpamAssassin / perl t/re). System perl on runners.
status = "required"
version_prefix = "5."
helper = "helpers/perl/match.py"

[busybox]
# E2: golden job (busybox-sed replay) installs busybox to verify sed-fallback
# fidelity against both GNU sed and BusyBox sed.
status = "required"
version_prefix = "1."
helper = "busybox"

[redos]
# helpers/redos/package.json + requirements-redos.txt
recheck = "4.5.0"
safe_regex2 = "5.1.1"
regexploit = "1.0.0"
